<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Demo Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e1b4b, #4338ca); color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 24px; }
    .wrap { width: 100%; max-width: 560px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { opacity: .75; margin-bottom: 20px; }
    .card { background: rgba(255,255,255,.12); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    .clock { font-size: 34px; font-weight: bold; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
    .row:last-child { border: none; }
    .badge { background: #22c55e; padding: 2px 10px; border-radius: 20px; font-size: 13px; }
    .add { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 15px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #facc15; font-weight: bold; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
    li.done span { text-decoration: line-through; opacity: .5; }
    li span { flex: 1; }
    li button { background: #ef4444; color: #fff; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CI/CD Demo Dashboard</h1>
    <div class="sub">Deployed automatically by a Jenkins pipeline</div>

    <div class="card">
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="card">
      <div class="row"><span>Status</span><span class="badge" id="status">checking...</span></div>
      <div class="row"><span>Build number</span><span id="build">-</span></div>
      <div class="row"><span>Node version</span><span id="node">-</span></div>
      <div class="row"><span>Uptime (seconds)</span><span id="uptime">-</span></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">My Tasks</h3>
      <div class="add">
        <input id="task" placeholder="Add a task and press Enter">
        <button id="addBtn">Add</button>
      </div>
      <ul id="list"></ul>
    </div>
  </div>

  <script>
    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(tick, 1000);
    tick();

    function loadInfo() {
      fetch('/api/info')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          document.getElementById('status').textContent = 'Running';
          document.getElementById('build').textContent = '#' + d.build;
          document.getElementById('node').textContent = d.node;
          document.getElementById('uptime').textContent = d.uptimeSeconds;
        })
        .catch(function () {
          document.getElementById('status').textContent = 'Down';
        });
    }
    loadInfo();
    setInterval(loadInfo, 5000);

    var tasks = [];
    try { tasks = JSON.parse(localStorage.getItem('tasks')) || []; } catch (e) { tasks = []; }

    function save() {
      try { localStorage.setItem('tasks', JSON.stringify(tasks)); } catch (e) {}
    }

    function render() {
      var list = document.getElementById('list');
      list.innerHTML = '';
      tasks.forEach(function (t, i) {
        var li = document.createElement('li');
        if (t.done) li.className = 'done';
        var span = document.createElement('span');
        span.textContent = t.text;
        var del = document.createElement('button');
        del.textContent = 'x';
        del.onclick = function (e) { e.stopPropagation(); tasks.splice(i, 1); save(); render(); };
        li.onclick = function () { t.done = !t.done; save(); render(); };
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function addTask() {
      var input = document.getElementById('task');
      var text = input.value.trim();
      if (!text) return;
      tasks.push({ text: text, done: false });
      input.value = '';
      save();
      render();
    }

    document.getElementById('addBtn').onclick = addTask;
    document.getElementById('task').onkeydown = function (e) { if (e.key === 'Enter') addTask(); };
    render();
  </script>
</body>
</html>
